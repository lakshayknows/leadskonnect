<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --ink:#0a0a0a; --soft:#6b6b6b; --line:#e5e5e5; --accent:#4b31e6; --soft-bg:#eeebfd; }
      * { box-sizing:border-box; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
      body { width:320px; margin:0; padding:16px; color:var(--ink); }
      h1 { font-size:15px; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
      .sub { font-size:11px; color:var(--soft); margin:0 0 14px; }
      .dot { width:8px; height:8px; border-radius:999px; background:#c4c4c4; display:inline-block; }
      .dot.on { background:#10b981; }
      .status { margin:0 0 14px; padding:10px; border-radius:8px; background:var(--soft-bg); font-size:12px; }
      .muted { color:var(--soft); font-size:11px; }
      .row { display:flex; gap:8px; }
      button { flex:1; border:0; border-radius:8px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer; }
      .toggle { background:var(--line); color:var(--ink); }
      .toggle.on { background:var(--accent); color:#fff; }
      .ghost { background:#fff; border:1px solid var(--line); color:var(--ink); }
      .draft { display:none; margin:0 0 14px; padding:12px; border-radius:10px; border:1px solid var(--accent); background:#fff; }
      .draft .kind { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); background:var(--soft-bg); border-radius:999px; padding:2px 8px; margin-bottom:6px; }
      .draft .who { font-size:13px; font-weight:600; margin:0 0 4px; }
      .draft .note { font-size:11px; color:var(--soft); margin:0 0 10px; max-height:60px; overflow:hidden; white-space:pre-wrap; }
      .draft .hint { font-size:10px; color:var(--soft); margin:0 0 10px; }
      .draft .primary { background:var(--accent); color:#fff; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> Followthroo · LinkedIn</h1>
    <p class="sub">Drafts your queued invites & messages — you review and send.</p>

    <div class="draft" id="draft">
      <span class="kind" id="draftKind">Message</span>
      <p class="who" id="draftWho"></p>
      <p class="note" id="draftNote"></p>
      <p class="hint">Send it yourself in the open LinkedIn tab, then confirm here.</p>
      <div class="row">
        <button class="primary" id="draftSent">I sent it ✓</button>
        <button class="ghost" id="draftSkip">Skip</button>
      </div>
    </div>

    <div class="status" id="status">Not connected.</div>
    <div class="row">
      <button class="toggle" id="toggle">Start</button>
      <button class="ghost" id="settings">Settings</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
